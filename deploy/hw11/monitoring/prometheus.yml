global:
  scrape_interval: 2s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: hw11-api
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [hw11]}
    relabel_configs:
      - {source_labels: [__meta_kubernetes_pod_label_app], action: keep, regex: hw11-api}
      - {source_labels: [__meta_kubernetes_pod_container_port_number], action: keep, regex: "8000"}
      - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
      - {source_labels: [__meta_kubernetes_namespace], target_label: namespace}
  - job_name: kube-state-metrics
    static_configs:
      - targets: [hw11-kube-state-metrics:8080]
  - job_name: kubelet-cadvisor
    scrape_interval: 5s
    scheme: https
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    kubernetes_sd_configs: [{role: node}]
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
