          source:
            kind: huggingface_snapshot
            dataset_id: Pablinho/movies-dataset
            revision: 97da8cd79f0c0ee06c2f45dd30a878967d6d87a4
            file: 9000plus.csv
            sha256:
              1d7636cc8ff75be70c0c00daaf5371242913dd29d17ac96417cf64ed4f581a6f
            url:
              https://huggingface.co/datasets/Pablinho/movies-dataset/resolve/97da8cd79f0c0ee06c2f45dd30a878967d6d87a4/9000plus.csv
            license: CC0-1.0
            license_url: https://creativecommons.org/publicdomain/zero/1.0/
            metadata_retrieved_at: '2026-09-21'
          target_clean_rows:
            v1: 3000
            v2: 6000
          transforms:
            required_columns:
            - Release_Date
            - Title
            - Overview
            - Original_Language
            - Genre
            title_column: Title
            description_column: Overview
            genres_column: Genre
            release_date_column: Release_Date
            language_column: Original_Language
            require_nonempty_description: true
            require_nonempty_genres: true
            title_type: movie
            title_type_strategy: dataset_scope
            excluded_source_labels:
            - TV Movie
            excluded_source_ids:
            - movie_34870477f31439c7c704739177d501ae9a7d635cf11727880daf030e1e591622
            - movie_8a6848fd219210debe1b13cd9604040c6399eb41d1e6d32c760f2e43f618b8f4
            min_genre_count: 25
            genre_separator: ','
            genre_aliases:
              Action: боевик
              Adventure: приключения
              Animation: анимация
              Comedy: комедия
              Crime: криминал
              Documentary: документальный
              Drama: драма
              Family: семейный
              Fantasy: фэнтези
              History: история
              Horror: ужасы
              Music: музыка
              Mystery: детектив
              Romance: мелодрама
              Science Fiction: фантастика
              Thriller: триллер
              War: военный
              Western: вестерн
            id:
              algorithm: sha256
              fields:
              - Title
              - Release_Date
              - Original_Language
              separator: "\x1F"
              prefix: movie_
            topic:
              template: release_year:{release_year}
            version_order:
              algorithm: sha256_source_id
              v1_is_prefix_of_v2: true
            system_prompt_selection:
              algorithm: sha256_mod
              key: source_id
          system_prompts:
          - Определи жанры фильма по его описанию. Ответь только списком жанров
            через запятую.
          - 'Классифицируй фильм по описанию: перечисли подходящие жанры через запятую
            без пояснений.'
          - По приведённому описанию назови жанры фильма. Выведи только жанровые
            метки через запятую.
          - Определи один или несколько жанров этого фильма по тексту. Никаких
            пояснений, только метки через запятую.
          - Прочитай описание фильма и укажи его жанры через запятую. Ответ
            должен содержать только жанры.
        paths.metrics_collect: metrics/collect.json
        paths.raw: data/raw.jsonl
