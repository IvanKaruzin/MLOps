model:
  name: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  device: auto
  dtype: bfloat16
  enable_thinking: false
data:
  train: data/tokenized/train.pt
  val: data/tokenized/val.pt
  source_train: data/train.jsonl
  source_val: data/val.jsonl
  tokenization_params: params.yaml
  auxiliary: data/eval/auxiliary.json
sampling:
  method: full_shuffle
  seed: 20261025
train:
  seed: 42
  max_steps: 2502
  train_limit: 4800
  val_limit: 599
  batch_size: 4
  grad_accum: 1
  eval_every: 626
  gradient_checkpointing: true
  response_format: json_genres
  view_max_seq_len: 768
  eval_batch_size: 4
  epochs: 1
  warmup_ratio: 0.05
  lr_schedule: cosine
  checkpoint_selection: best_val
  worker_timeout_seconds: 21600
lora:
  dropout: 0.05
  alpha_over_r: 2
sweep:
- name: qv-r4-low
  r: 4
  lr: 0.0001
  target_modules:
  - q_proj
  - v_proj
- name: qv-r4-high
  r: 4
  lr: 0.0003
  target_modules:
  - q_proj
  - v_proj
- name: qv-r8-low
  r: 8
  lr: 0.0001
  target_modules:
  - q_proj
  - v_proj
- name: qv-r8-high
  r: 8
  lr: 0.0003
  target_modules:
  - q_proj
  - v_proj
- name: all-r8-low
  r: 8
  lr: 0.0001
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
- name: all-r8-high
  r: 8
  lr: 0.0003
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
tracking:
  uri: http://127.0.0.1:5006
  experiment: hw67-main-json-aligned
registry:
  name: my-qwen-adapter
  alias: candidate
  max_val_ratio: 1.0
generation:
  max_new_tokens: 96
  system: 'Определи все применимые жанры фильма по его описанию. Допустимые жанровые
    метки: анимация, боевик, вестерн, военный, детектив, документальный, драма, история,
    комедия, криминал, мелодрама, музыка, приключения, семейный, триллер, ужасы, фантастика,
    фэнтези. Верни только JSON-объект с единственным полем answer: его значение —
    строка жанров через запятую. Не добавляй пояснений или Markdown. Если запрос не
    относится к определению жанров фильма по описанию, верни {"answer":"REFUSE"}.
    REFUSE является отказом, а не жанром.'
  prompts:
  - A spaceship crew explores an unknown planet and discovers an alien civilization.
  - A detective investigates a mysterious murder while the suspect tries to escape.
