name: Fast release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Шаблон предполагает release.py и tests/ в корне репозитория.
      # При вложенном проекте задайте working-directory для run.
      - run: python -m compileall -q release.py tests
      - run: python -m unittest discover -s tests -v
