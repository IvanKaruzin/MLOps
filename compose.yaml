services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: classroom-local
      POSTGRES_DB: mlflow
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 3s
      timeout: 3s
      retries: 20
  mlflow:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5006}:5000"
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=1
      - --backend-store-uri=postgresql://mlflow:classroom-local@db:5432/mlflow
      - --serve-artifacts
      - --artifacts-destination=/mlartifacts
    volumes:
      - artifacts:/mlartifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  postgres:
  artifacts:
