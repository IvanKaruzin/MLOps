# Единственное место, где живёт имя модели.
# Менять модель под своё железо нужно ЗДЕСЬ, а не в коде.
model:
  name: "Qwen/Qwen3-0.6B"
  dtype: "bfloat16"
  device: "auto"            # auto | cpu | cuda | mps

generate:
  max_new_tokens: 200
  temperature: 0.0          # жадная декодировка, воспроизводимый вывод
  seed: 67
  enable_thinking: false    # Qwen3 без этого отвечает <think>-блоком

# ДЗ-4 использует train/val стадии split ДЗ-3. Пути дублируют paths.train/val
# ради контракта проверочного скрипта; src.config проверяет их совпадение.
data:
  train_jsonl: "data/train.jsonl"
  val_jsonl: "data/val.jsonl"
  out_dir: "data/tokenized"
  train: "data/tokenized/train.pt"
  val: "data/tokenized/val.pt"
  # Только для преподавательского среза; обычный запуск использует split ДЗ-3.
  source_train: "../../datasets/nmo/sft_single/train/0000.parquet"
  source_val: "../../datasets/nmo/sft_single/validation/0000.parquet"

sample:
  train_size: 500
  val_size: 100
  scan_rows: 20000
  seed: 42

tokenize:
  # На v2 полная длина train/val по предварительному замеру не выше 301/274.
  max_seq_len: 320
  truncated_warn_ratio: 0.05
  padding_side: "left"

packing:
  # Без блочной маски внимания packing смешивает примеры между собой.
  enabled: false
  batch_size: 8

train_estimate:
  epochs: 3
  # Медиана генерации Qwen3-1.7B на этой машине из docs/hardware.md.
  # Это оптимистичная граница для обучения, а не замер backward.
  tokens_per_sec: 42.69

bench:
  warmup_runs: 1            # прогрев не засчитывается в замер
  measure_runs: 3
  prompt: "Объясни, что такое MLOps, в трёх предложениях."

hooks:
  prompt: "Объясни, что такое MLOps, в трёх предложениях."
  plot: "docs/activations.png"

memory:
  # Один шаг forward+backward+optimizer на короткой последовательности.
  # 128 токенов тоже влезают, но разрыв между LoRA и инференсом там ~150 МБ
  # и тонет в шуме аллокатора; на 256 разница видна невооружённым глазом.
  seq_len: 256
  batch_size: 1
  lr: 1.0e-5
  # Сколько раз повторить каждый режим (каждый прогон — отдельный процесс).
  # Берётся худший пик, число прогонов уходит в «Условия замера» отчёта:
  # цифра, снятая один раз, и медиана пяти — разные утверждения.
  repeats: 1

lora:
  alpha_ratio: 2            # lora_alpha = alpha_ratio * r
  dropout: 0.05
  r: 8
  alpha: 16
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  # Первый конфиг используется ещё и в замере памяти.
  configs:
    - name: "r=8, q_proj+v_proj"
      r: 8
      target_modules: ["q_proj", "v_proj"]
    - name: "r=16, все линейные"
      r: 16
      target_modules: ["q_proj", "k_proj", "v_proj", "o_proj",
                       "gate_proj", "up_proj", "down_proj"]

report:
  json: "docs/report.json"
  markdown: "docs/anatomy.md"

# ДЗ-3: сбор датасета описаний фильмов для многометочной классификации.
# Секретов здесь нет: fallback Hugging Face является публичным snapshot.
collect:
  # Версия переключается только здесь; v1 строится как префикс стабильного
  # SHA-256-ранжирования v2, поэтому идентификаторы общих строк не меняются.
  version: "v2"             # v1 | v2
  sources:
    v1:
      - "sources/movies-dataset/9000plus.csv"
    v2:
      - "sources/movies-dataset/9000plus.csv"
  source:
    kind: "huggingface_snapshot"
    dataset_id: "Pablinho/movies-dataset"
    revision: "97da8cd79f0c0ee06c2f45dd30a878967d6d87a4"
    file: "9000plus.csv"
    sha256: "1d7636cc8ff75be70c0c00daaf5371242913dd29d17ac96417cf64ed4f581a6f"
    url: "https://huggingface.co/datasets/Pablinho/movies-dataset/resolve/97da8cd79f0c0ee06c2f45dd30a878967d6d87a4/9000plus.csv"
    license: "CC0-1.0"
    license_url: "https://creativecommons.org/publicdomain/zero/1.0/"
    metadata_retrieved_at: "2026-09-21"

  # Лимиты применяются после обязательных фильтров и стабильной сортировки.
  # Полный snapshot (9837 строк по карточке) даёт запас на очистку. Если первый
  # прогон не достигает target_clean_rows, сдаваемая версия не публикуется.
  target_clean_rows:
    v1: 3000
    v2: 6000
  transforms:
    required_columns:
      - "Release_Date"
      - "Title"
      - "Overview"
      - "Original_Language"
      - "Genre"
    title_column: "Title"
    description_column: "Overview"
    genres_column: "Genre"
    release_date_column: "Release_Date"
    language_column: "Original_Language"
    require_nonempty_description: true
    require_nonempty_genres: true
    title_type: "movie"
    title_type_strategy: "dataset_scope"
    excluded_source_labels:
      - "TV Movie"
    # Stable ids discovered by the reproducible 50-row manual audit. Both are
    # shorts/specials rather than feature films, so the complete records are
    # removed instead of silently changing source labels.
    excluded_source_ids:
      - "movie_34870477f31439c7c704739177d501ae9a7d635cf11727880daf030e1e591622"
      - "movie_8a6848fd219210debe1b13cd9604040c6399eb41d1e6d32c760f2e43f618b8f4"
    min_genre_count: 25
    genre_separator: ","
    genre_aliases:
      Action: "боевик"
      Adventure: "приключения"
      Animation: "анимация"
      Comedy: "комедия"
      Crime: "криминал"
      Documentary: "документальный"
      Drama: "драма"
      Family: "семейный"
      Fantasy: "фэнтези"
      History: "история"
      Horror: "ужасы"
      Music: "музыка"
      Mystery: "детектив"
      Romance: "мелодрама"
      Science Fiction: "фантастика"
      Thriller: "триллер"
      War: "военный"
      Western: "вестерн"
    id:
      algorithm: "sha256"
      fields: ["Title", "Release_Date", "Original_Language"]
      separator: "\u001f"
      prefix: "movie_"
    topic:
      template: "release_year:{release_year}"
    version_order:
      algorithm: "sha256_source_id"
      v1_is_prefix_of_v2: true
    system_prompt_selection:
      algorithm: "sha256_mod"
      key: "source_id"

  system_prompts:
    - "Определи жанры фильма по его описанию. Ответь только списком жанров через запятую."
    - "Классифицируй фильм по описанию: перечисли подходящие жанры через запятую без пояснений."
    - "По приведённому описанию назови жанры фильма. Выведи только жанровые метки через запятую."
    - "Определи один или несколько жанров этого фильма по тексту. Никаких пояснений, только метки через запятую."
    - "Прочитай описание фильма и укажи его жанры через запятую. Ответ должен содержать только жанры."

clean:
  # Фильтр длин: слишком короткое описание — обрезок, слишком длинное — выброс.
  min_user_chars: 30
  max_user_chars: 4000
  min_assistant_chars: 2
  near_dup:
    enabled: true
    shingle_words: 4
    num_perm: 64
    threshold: 0.85
  pii:
    enabled: true

diversity:
  # Пороговые значения относятся к очищенному датасету. Ответ — короткий
  # набор меток из конечного словаря, поэтому повторы допустимы, но компенсированы
  # строгими гейтами по описаниям, числу жанров и балансу меток.
  min_examples: 1000
  min_system_prompts: 3
  min_groups: 50
  max_group_share: 0.10
  min_answer_len_ratio: 1.6
  max_same_length_share: 0.25
  max_duplicate_answer_share: 0.90
  min_genres: 15
  max_genre_share: 0.50
  min_multilabel_share: 0.60
  min_description_len_ratio: 2.5

split:
  group_key: "topic"
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  seed: 42
  # Несколько детерминированных назначений целых годов позволяют одновременно
  # приблизить доли по строкам и выровнять жанровое распределение.
  search_attempts: 512
  max_genre_total_variation: 0.10

contamination:
  # Этот порог обязан совпадать с clean.near_dup.threshold; load_params()
  # проверяет инвариант до запуска любой стадии.
  threshold: 0.85

paths:
  raw: "data/raw.jsonl"
  clean: "data/clean.jsonl"
  train: "data/train.jsonl"
  val: "data/val.jsonl"
  test: "data/test.jsonl"
  metrics_collect: "metrics/collect.json"
  metrics_clean: "metrics/clean.json"
  metrics_diversity: "metrics/diversity.json"
  metrics_split: "metrics/split.json"
  metrics_contamination: "metrics/contamination.json"
  datasheet: "docs/datasheet.md"
  models: "models"
  metrics: "metrics"
  curves: "docs/curves.png"
  compare: "docs/compare.md"

# ДЗ-5: оба варианта используют все собственные train/val из ДЗ-4.
train:
  seed: 42
  epochs: 1
  batch_size: 2
  grad_accum: 4
  lr: 0.0002
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  eval_every: 10
  eval_batch_size: 2
  gradient_checkpointing: true
  max_steps: null
variants:
- name: all_layers
  freeze_first: 0
- name: freeze14
  freeze_first: 14
compare:
  max_new_tokens: 40
  prompts:
  - Francis, a young man, recalls in his memory the horrible experiences he and his
    fiancée Jane recently went through. Francis and his friend Alan visit The Cabinet
    of Dr. Caligari, an exhibit where the mysterious doctor shows the somnambulist
    Cesare, and awakens him for some moments from his death-like sleep.
  - During America’s Civil War, Union spies steal engineer Johnnie Gray's beloved
    locomotive, 'The General'—with Johnnie's lady love aboard an attached boxcar—and
    he single-handedly must do all in his power to both get The General back and to
    rescue Annabelle.
  - In a futuristic city sharply divided between the working class and the city planners,
    the son of the city's mastermind falls in love with a working class prophet who
    predicts the coming of a savior to mediate their differences.
  - Un Chien Andalou is an European avant-garde surrealist film, a collaboration between
    director Luis Buñuel and Salvador Dali.
  - Dr. Henry Jekyll believes that there are two distinct sides to men - a good and
    an evil side. He believes that by separating the two, man can become liberated.
    He succeeds in his experiments with chemicals to accomplish this and transforms
    into Hyde to commit horrendous crimes. When he discontinues use of the drug, it
    is already too late.
  system: Определи жанры фильма по его описанию. Ответь только списком жанров через
    запятую.
  expected:
  - драма, криминал, триллер, ужасы
  - боевик, военный, драма, комедия, приключения
  - драма, фантастика
  - ужасы, фэнтези
  - ужасы, фантастика
  source_ids:
  - movie_de2347cf6a48feb5f30d587fbf181485daa20be1b1394cb64020c0a2a9e17a92
  - movie_a120cdc23310ceb38837208e1234d5322e478f08c98a1f9c14a8d1605b86c22f
  - movie_c88d68979ad500edecb4b92adc824f816a170ad8cab7b4bbaa62d43ae665110c
  - movie_72f8fdbe7fbe2a2fcfb7239ed242a11018ea8d18625a1e3969ab80f6c5c60cd9
  - movie_1d66bcfd17681eacff8d85ac9d2f05ee34fa7512ecb1c02fa428bff79f65f71b
